<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Usage Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
        }
        
        h1 {
            color: #333;
            flex: 1;
        }
        
        .status-badge {
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            background: #d4edda;
            color: #155724;
        }
        
        .session-info {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .session-info div {
            display: flex;
            flex-direction: column;
        }
        
        .session-label {
            font-size: 0.85em;
            color: #666;
            font-weight: 600;
            margin-bottom: 3px;
        }
        
        .session-value {
            font-size: 1.1em;
            color: #333;
            font-weight: 600;
        }
        
        .session-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-left: auto;
        }
        
        .section {
            margin-bottom: 40px;
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 15px;
            margin-bottom: 20px;
            align-items: flex-end;
        }
        
        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        
        select, input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 10px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        button.secondary {
            background: #6c757d;
            padding: 8px 15px;
            font-size: 0.9em;
        }
        
        button.secondary:hover {
            background: #5a6268;
        }
        
        button.danger {
            background: #dc3545;
        }
        
        button.danger:hover {
            background: #c82333;
        }
        
        button.success {
            background: #28a745;
        }
        
        button.success:hover {
            background: #218838;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .stat-card h3 {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        
        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
        }
        
        .stat-card.alert {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }
        
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        
        tr:hover {
            background: #f9f9f9;
        }
        
        .alert-badge {
            display: inline-block;
            background: #f5576c;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .no-alert {
            color: #28a745;
            font-weight: 600;
        }
        
        .export-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        
        @media (max-width: 768px) {
            .form-group {
                grid-template-columns: 1fr;
            }
            
            .header {
                flex-direction: column;
                gap: 10px;
            }
            
            .session-info {
                flex-direction: column;
                gap: 10px;
            }
            
            .session-controls {
                margin-left: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏗️ Machine Usage Tracker</h1>
            <span class="status-badge" id="statusBadge">✓ Ready</span>
        </div>
        
        <div class="success-message" id="successMessage"></div>
        <div class="error-message" id="errorMessage"></div>
        
        <!-- Session Info -->
        <div class="session-info">
            <div>
                <span class="session-label">👤 Current User</span>
                <span class="session-value" id="currentUser">Not selected</span>
            </div>
            <div>
                <span class="session-label">📅 Session Started</span>
                <span class="session-value" id="sessionStart">--:--</span>
            </div>
            <div>
                <span class="session-label">⏱️ Session Duration</span>
                <span class="session-value" id="sessionDuration">00:00:00</span>
            </div>
            <div class="session-controls">
                <button class="success" onclick="app.startNewSession()">🔄 New Session</button>
                <button class="danger" onclick="app.endSession()">🛑 End & Export</button>
            </div>
        </div>
        
        <!-- Log Usage Section -->
        <div class="section">
            <h2>Log Machine Usage</h2>
            <div class="form-group">
                <div>
                    <label for="machine">Machine</label>
                    <select id="machine" required>
                        <option value="">Select Machine...</option>
                    </select>
                </div>
                <div>
                    <label for="user">User</label>
                    <select id="user" required>
                        <option value="">Select User...</option>
                    </select>
                </div>
                <div>
                    <label for="hours">Hours Used</label>
                    <input type="number" id="hours" placeholder="0.0" step="0.1" min="0" required>
                </div>
                <button onclick="app.logUsage()">Log Usage</button>
            </div>
        </div>
        
        <!-- Machine Status Section -->
        <div class="section">
            <h2>Machine Status</h2>
            <div class="stats-grid" id="machineStats"></div>
        </div>
        
        <!-- Machines Summary Table -->
        <div class="section">
            <h2>Machines Summary</h2>
            <table id="machinesTable">
                <thead>
                    <tr>
                        <th>Machine</th>
                        <th>Total Hours</th>
                        <th>Status</th>
                        <th>Last Maintenance</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        
        <!-- Usage Logs Section -->
        <div class="section">
            <h2>Usage Logs (Current Session)</h2>
            <table id="usageTable">
                <thead>
                    <tr>
                        <th>Machine</th>
                        <th>User</th>
                        <th>Hours</th>
                        <th>Date & Time</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        
        <!-- Export Section -->
        <div class="section">
            <h2>Export Data</h2>
            <div class="export-buttons">
                <button class="secondary" onclick="app.exportCSV()">📥 Export CSV</button>
                <button class="secondary" onclick="app.exportXML()">📥 Export XML</button>
                <button class="secondary danger" onclick="app.clearAllData()">🗑️ Clear All</button>
            </div>
        </div>
    </div>
    
    <script src="config.js"></script>
    <script>
        // Machine Usage Tracker App
        const app = {
            machines: [],
            users: [],
            sessionLogs: [],
            allLogs: [],
            currentSession: null,
            sessionStartTime: null,
            sessionDurationInterval: null,
            
            async init() {
                console.log('Initializing Machine Usage Tracker...');
                this.initializeData();
                this.loadFromLocalStorage();
                this.startNewSession();
                this.render();
                this.startAutoSync();
                this.startSessionTimer();
            },
            
            initializeData() {
                // Initialize machines
                if (this.machines.length === 0) {
                    this.machines = CONFIG.MACHINES.map((name, index) => ({
                        id: index + 1,
                        name: name,
                        total_hours: 0,
                        maintenance_alert: false,
                        last_maintenance: this.getCurrentDateTime()
                    }));
                }
                
                // Initialize users
                if (this.users.length === 0) {
                    this.users = CONFIG.USERS.map((name, index) => ({
                        id: index + 1,
                        name: name
                    }));
                }
            },
            
            startNewSession() {
                const user = document.getElementById('user').value;
                if (!user) {
                    this.showError('Please select a user first');
                    return;
                }
                
                const selectedUser = this.users.find(u => u.id == user);
                this.currentSession = {
                    user: selectedUser.name,
                    userId: selectedUser.id,
                    startTime: new Date(),
                    logs: []
                };
                
                this.sessionLogs = [];
                this.sessionStartTime = new Date();
                document.getElementById('currentUser').textContent = selectedUser.name;
                document.getElementById('sessionStart').textContent = this.getCurrentDateTime();
                
                this.saveToLocalStorage();
                this.showSuccess(`✓ Session started for ${selectedUser.name}`);
                this.render();
            },
            
            startSessionTimer() {
                if (this.sessionDurationInterval) clearInterval(this.sessionDurationInterval);
                
                this.sessionDurationInterval = setInterval(() => {
                    if (this.sessionStartTime) {
                        const now = new Date();
                        const diff = Math.floor((now - this.sessionStartTime) / 1000);
                        const hours = Math.floor(diff / 3600);
                        const minutes = Math.floor((diff % 3600) / 60);
                        const seconds = diff % 60;
                        
                        const duration = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                        document.getElementById('sessionDuration').textContent = duration;
                    }
                }, 1000);
            },
            
            endSession() {
                if (!this.currentSession) {
                    this.showError('No active session');
                    return;
                }
                
                if (this.sessionLogs.length === 0) {
                    this.showError('No usage logged in this session');
                    return;
                }
                
                const confirmed = confirm(`Export session for ${this.currentSession.user}?\n\nFile: ${this.currentSession.user.replace(/\s+/g, '_')}_${this.getFileDateTime()}.xml`);
                if (!confirmed) return;
                
                // Export XML
                this.exportSessionXML();
                
                // Clear session
                this.currentSession = null;
                this.sessionLogs = [];
                this.sessionStartTime = null;
                document.getElementById('currentUser').textContent = 'Not selected';
                document.getElementById('sessionStart').textContent = '--:--';
                document.getElementById('sessionDuration').textContent = '00:00:00';
                document.getElementById('user').value = '';
                
                this.saveToLocalStorage();
                this.showSuccess('✓ Session ended and exported!');
                this.render();
            },
            
            async logUsage() {
                const machineId = document.getElementById('machine').value;
                const userId = document.getElementById('user').value;
                const hours = document.getElementById('hours').value;
                
                if (!machineId || !userId || !hours) {
                    this.showError('Please fill all fields');
                    return;
                }
                
                if (!this.currentSession) {
                    this.showError('No active session. Please start a new session.');
                    return;
                }
                
                const machine = this.machines.find(m => m.id == machineId);
                const user = this.users.find(u => u.id == userId);
                
                const log = {
                    id: Date.now(),
                    machine: machine.name,
                    user: user.name,
                    hours: parseFloat(hours),
                    timestamp: this.getCurrentDateTime()
                };
                
                this.sessionLogs.push(log);
                this.allLogs.push(log);
                machine.total_hours += parseFloat(hours);
                
                // Check for maintenance alert (every 220 hours)
                if (machine.total_hours >= 220) {
                    machine.maintenance_alert = true;
                }
                
                this.showSuccess(`✓ Logged ${hours}h for ${machine.name}`);
                document.getElementById('hours').value = '';
                document.getElementById('machine').value = '';
                
                this.saveToLocalStorage();
                this.render();
            },
            
            async resetMaintenance(machineId) {
                if (!confirm('Reset maintenance for this machine?')) return;
                
                const machine = this.machines.find(m => m.id == machineId);
                if (machine) {
                    machine.maintenance_alert = false;
                    machine.total_hours = 0;
                    machine.last_maintenance = this.getCurrentDateTime();
                    this.saveToLocalStorage();
                    this.showSuccess(`✓ Maintenance reset for ${machine.name}`);
                    this.render();
                }
            },
            
            exportCSV() {
                let csv = 'Machine,User,Hours,Timestamp\n';
                
                this.sessionLogs.forEach(log => {
                    csv += `"${log.machine}","${log.user}",${log.hours},"${log.timestamp}"\n`;
                });
                
                csv += '\n\nMachine,Total Hours,Maintenance Alert\n';
                this.machines.forEach(m => {
                    csv += `"${m.name}",${m.total_hours},${m.maintenance_alert ? 'YES' : 'NO'}\n`;
                });
                
                this.downloadFile(csv, 'text/csv', 'machine_usage.csv');
            },
            
            exportXML() {
                const xmlContent = this.generateSessionXML();
                this.downloadFile(xmlContent, 'application/xml', 'machine_usage.xml');
            },
            
            exportSessionXML() {
                const xmlContent = this.generateSessionXML();
                const userName = this.currentSession.user.replace(/\s+/g, '_');
                const dateTime = this.getFileDateTime();
                const filename = `${userName}_${dateTime}.xml`;
                this.downloadFile(xmlContent, 'application/xml', filename);
            },
            
            generateSessionXML() {
                let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
                xml += '<MachineUsageReport>\n';
                xml += `  <Metadata>\n`;
                xml += `    <Timestamp>${this.getCurrentDateTime()}</Timestamp>\n`;
                if (this.currentSession) {
                    xml += `    <User>${this.escapeXml(this.currentSession.user)}</User>\n`;
                    xml += `    <SessionStart>${this.currentSession.startTime.toLocaleString()}</SessionStart>\n`;
                }
                xml += `  </Metadata>\n`;
                
                xml += '  <UsageLogs>\n';
                (this.sessionLogs.length > 0 ? this.sessionLogs : this.allLogs).forEach(log => {
                    xml += '    <Log>\n';
                    xml += `      <Machine>${this.escapeXml(log.machine)}</Machine>\n`;
                    xml += `      <User>${this.escapeXml(log.user)}</User>\n`;
                    xml += `      <Hours>${log.hours}</Hours>\n`;
                    xml += `      <Timestamp>${log.timestamp}</Timestamp>\n`;
                    xml += '    </Log>\n';
                });
                xml += '  </UsageLogs>\n';
                
                xml += '  <MachineSummary>\n';
                this.machines.forEach(m => {
                    xml += '    <Machine>\n';
                    xml += `      <Name>${this.escapeXml(m.name)}</Name>\n`;
                    xml += `      <TotalHours>${m.total_hours}</TotalHours>\n`;
                    xml += `      <MaintenanceAlert>${m.maintenance_alert ? 'YES' : 'NO'}</MaintenanceAlert>\n`;
                    xml += `      <LastMaintenance>${m.last_maintenance}</LastMaintenance>\n`;
                    xml += '    </Machine>\n';
                });
                xml += '  </MachineSummary>\n';
                xml += '</MachineUsageReport>';
                
                return xml;
            },
            
            escapeXml(str) {
                if (!str) return '';
                return str.replace(/[<>&'"]/g, function (c) {
                    switch (c) {
                        case '<': return '&lt;';
                        case '>': return '&gt;';
                        case '&': return '&amp;';
                        case '\'': return '&apos;';
                        case '"': return '&quot;';
                    }
                });
            },
            
            downloadFile(content, mimeType, filename) {
                const blob = new Blob([content], { type: mimeType });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                this.showSuccess(`✓ Downloaded: ${filename}`);
            },
            
            clearAllData() {
                if (!confirm('⚠️ This will clear ALL data. Are you sure?')) return;
                
                this.machines.forEach(m => {
                    m.total_hours = 0;
                    m.maintenance_alert = false;
                    m.last_maintenance = this.getCurrentDateTime();
                });
                this.sessionLogs = [];
                this.allLogs = [];
                
                this.saveToLocalStorage();
                this.showSuccess('✓ All data cleared!');
                this.render();
            },
            
            render() {
                this.renderDropdowns();
                this.renderStats();
                this.renderMachinesTable();
                this.renderUsageLogs();
            },
            
            renderDropdowns() {
                const machineSelect = document.getElementById('machine');
                const userSelect = document.getElementById('user');
                
                machineSelect.innerHTML = '<option value="">Select Machine...</option>';
                this.machines.forEach(m => {
                    const option = document.createElement('option');
                    option.value = m.id;
                    option.text = m.name;
                    machineSelect.appendChild(option);
                });
                
                userSelect.innerHTML = '<option value="">Select User...</option>';
                this.users.forEach(u => {
                    const option = document.createElement('option');
                    option.value = u.id;
                    option.text = u.name;
                    userSelect.appendChild(option);
                });
            },
            
            renderStats() {
                const container = document.getElementById('machineStats');
                container.innerHTML = '';
                
                this.machines.forEach(m => {
                    const card = document.createElement('div');
                    const isAlert = m.maintenance_alert;
                    card.className = `stat-card ${isAlert ? 'alert' : ''}`;
                    const nextMaintenance = 220 - (m.total_hours % 220);
                    
                    card.innerHTML = `
                        <h3>${m.name}</h3>
                        <div class="value">${m.total_hours.toFixed(1)}h</div>
                        <div style="font-size: 0.9em; margin-top: 10px;">
                            ${isAlert ? '⚠️ MAINTENANCE ALERT!' : `Next maintenance: ${nextMaintenance.toFixed(1)}h`}
                        </div>
                    `;
                    container.appendChild(card);
                });
            },
            
            renderMachinesTable() {
                const tbody = document.getElementById('machinesTable').querySelector('tbody');
                tbody.innerHTML = '';
                
                this.machines.forEach(m => {
                    const row = tbody.insertRow();
                    const statusHTML = m.maintenance_alert 
                        ? '<span class="alert-badge">⚠️ MAINTENANCE NEEDED</span>' 
                        : '<span class="no-alert">✓ OK</span>';
                    
                    row.innerHTML = `
                        <td><strong>${m.name}</strong></td>
                        <td>${m.total_hours.toFixed(1)}h</td>
                        <td>${statusHTML}</td>
                        <td>${m.last_maintenance}</td>
                        <td><button class="secondary danger" onclick="app.resetMaintenance(${m.id})">Reset</button></td>
                    `;
                });
            },
            
            renderUsageLogs() {
                const tbody = document.getElementById('usageTable').querySelector('tbody');
                tbody.innerHTML = '';
                
                [...this.sessionLogs].reverse().forEach(log => {
                    const row = tbody.insertRow();
                    row.innerHTML = `
                        <td>${log.machine}</td>
                        <td>${log.user}</td>
                        <td>${log.hours.toFixed(1)}h</td>
                        <td>${log.timestamp}</td>
                    `;
                });
                
                if (this.sessionLogs.length === 0) {
                    const row = tbody.insertRow();
                    row.innerHTML = '<td colspan="4" style="text-align: center; color: #999;">No logs yet - start logging usage</td>';
                }
            },
            
            showSuccess(msg) {
                const el = document.getElementById('successMessage');
                el.textContent = msg;
                el.style.display = 'block';
                setTimeout(() => el.style.display = 'none', 4000);
            },
            
            showError(msg) {
                const el = document.getElementById('errorMessage');
                el.textContent = msg;
                el.style.display = 'block';
                setTimeout(() => el.style.display = 'none', 4000);
            },
            
            startAutoSync() {
                setInterval(() => this.saveToLocalStorage(), CONFIG.SYNC_INTERVAL);
            },
            
            saveToLocalStorage() {
                localStorage.setItem('machines', JSON.stringify(this.machines));
                localStorage.setItem('users', JSON.stringify(this.users));
                localStorage.setItem('sessionLogs', JSON.stringify(this.sessionLogs));
                localStorage.setItem('allLogs', JSON.stringify(this.allLogs));
                if (this.currentSession) {
                    localStorage.setItem('currentSession', JSON.stringify(this.currentSession));
                }
            },
            
            loadFromLocalStorage() {
                const machines = localStorage.getItem('machines');
                const users = localStorage.getItem('users');
                const sessionLogs = localStorage.getItem('sessionLogs');
                const allLogs = localStorage.getItem('allLogs');
                const currentSession = localStorage.getItem('currentSession');
                
                if (machines) this.machines = JSON.parse(machines);
                if (users) this.users = JSON.parse(users);
                if (sessionLogs) this.sessionLogs = JSON.parse(sessionLogs);
                if (allLogs) this.allLogs = JSON.parse(allLogs);
                if (currentSession) this.currentSession = JSON.parse(currentSession);
            },
            
            getCurrentDateTime() {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
            },
            
            getFileDateTime() {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                return `${year}${month}${day}_${hours}${minutes}${seconds}`;
            }
        };
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
